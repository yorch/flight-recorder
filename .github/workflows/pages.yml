name: Pages

# Publishes the documentation site (site/) to GitHub Pages on pushes that touch
# a source document or the site itself. Build runs with read-only permissions;
# only the deploy job gets pages:write/id-token, and only on the main ref, so a
# fork PR can never publish (SPEC §14.1).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'README.md'
      - 'SPEC.md'
      - 'docs/**'
      - 'scripts/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Keep in step with `packageManager` in package.json.
  BUN_VERSION: '1.4.1'

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --frozen-lockfile
      # Generates the docs from README/SPEC/docs, builds, then checks every
      # internal link and fragment in the emitted HTML.
      - name: Build (docs + astro + link check)
        run: bun run site:build
      # v5
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      # v3
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/dist

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v4
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
