name: CI

# Fast gates from SPEC §14: lint, typecheck, unit tests + coverage, shell and
# Dockerfile lint. The Docker-based acceptance suite lives in acceptance.yml.
# Actions are pinned to commit SHAs (dependabot keeps them current).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '26'

jobs:
  static:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Install (root + ui)
        run: |
          npm ci
          npm --prefix ui ci
      - name: Biome (format + lint, warnings are errors)
        run: npm run lint
      - name: Typecheck (root)
        run: npm run typecheck
      - name: Typecheck (ui)
        run: npm run ui:typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - name: Install (root + ui)
        run: |
          npm ci
          npm --prefix ui ci
      - name: node:test with coverage thresholds (SPEC §14)
        run: npm run test:coverage
      - name: vitest (ui)
        run: npm run ui:test

  docker-lint:
    name: Shell & Dockerfile lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm ci: these scripts only shell out to the pinned linter images.
      - name: shellcheck (pinned image)
        run: npm run lint:shell
      - name: hadolint (pinned image)
        run: npm run lint:docker

  # Single required check for branch protection: red if any gate above failed.
  ci:
    name: CI
    needs: [static, unit, docker-lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate gate results
        run: |
          failed=''
          for result in ${{ join(needs.*.result, ' ') }}; do
            [ "$result" = success ] || failed="$failed $result"
          done
          if [ -n "$failed" ]; then
            echo "Not all gates succeeded:$failed"
            exit 1
          fi
          echo "All gates succeeded"
