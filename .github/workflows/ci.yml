name: CI

# Fast gates from SPEC §14: lint, typecheck, unit tests + coverage, shell and
# Dockerfile lint. The Docker-based acceptance suite lives in acceptance.yml.
# Actions are pinned to commit SHAs (dependabot keeps them current).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with `packageManager` in package.json.
  BUN_VERSION: '1.4.1'

jobs:
  static:
    name: Lint & typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install (single workspace lock)
        run: bun install --frozen-lockfile
      - name: Biome (format + lint, warnings are errors)
        run: bun run lint
      - name: Typecheck (root)
        run: bun run typecheck
      - name: Typecheck (ui)
        run: bun run ui:typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install (single workspace lock)
        run: bun install --frozen-lockfile
      - name: bun test + aggregate coverage gate (SPEC §14)
        run: bun run test:coverage
      - name: vitest (ui)
        run: bun run ui:test

  docker-lint:
    name: Shell & Dockerfile lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No install: these scripts only shell out to the pinned linter images.
      # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: shellcheck (pinned image)
        run: bun run lint:shell
      - name: hadolint (pinned image)
        run: bun run lint:docker

  site:
    name: Docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install (single workspace lock)
        run: bun install --frozen-lockfile
      # Regenerates the docs from README/SPEC/docs, builds the site and fails on
      # a broken internal link or fragment (SPEC §14.1).
      - name: Build site + link check
        run: bun run site:build

  # Single required check for branch protection: red if any gate above failed.
  ci:
    name: CI
    needs: [static, unit, docker-lint, site]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate gate results
        run: |
          failed=''
          for result in ${{ join(needs.*.result, ' ') }}; do
            [ "$result" = success ] || failed="$failed $result"
          done
          if [ -n "$failed" ]; then
            echo "Not all gates succeeded:$failed"
            exit 1
          fi
          echo "All gates succeeded"
