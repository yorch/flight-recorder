http_port 3128 name=browser
http_port 3129 name=agent
acl browser_port myportname browser
acl agent_port myportname agent
acl b1_host dstdomain allowed.test
acl b1_port port 8080
http_access allow browser_port b1_host b1_port
acl b101_host dstdomain .cdn.test
acl b101_port port 8080
http_access allow browser_port b101_host b101_port
acl g1_host dstdomain llm.test
acl g1_port port 8080
http_access allow agent_port g1_host g1_port
http_access deny all
cache deny all
via off
forwarded_for delete
logformat pair %ts.%03tu %>a %>la:%>lp %rm %ru %>Hs %Ss
access_log stdio:/var/log/squid-pair/access.log pair
cache_log stdio:/var/log/squid-pair/cache.log
debug_options ALL,1 14,3 78,3
