services:
  browser:
    build:
      context: ./browser
      args: &proxy_args
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        no_proxy: ${no_proxy:-}
        NO_PROXY: ${NO_PROXY:-}
    platform: linux/arm64
    init: true
    ipc: shareable
    shm_size: 2gb
    # cap_drop:[ALL] and no-new-privileges break Chrome's sandboxed startup
    # (zygote sys_chroot fails); dropped so Chrome runs WITH its sandbox.
    security_opt:
      - seccomp=../seccomp_profile.json
    volumes:
      - x11:/tmp/.X11-unix
    environment:
      DISPLAY: ":99"
      SCREEN_WIDTH: "1920"
      SCREEN_HEIGHT: "1080"
      CHROME_EXTRA_ARGS: ${CHROME_EXTRA_ARGS:-}
      CHROME_NO_SANDBOX: ${CHROME_NO_SANDBOX:-0}
      CHROME_DISABLE_GPU: ${CHROME_DISABLE_GPU:-1}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9222/json/version"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  orchestrator:
    build:
      context: ..
      dockerfile: arm-a/orchestrator/Dockerfile
      args: *proxy_args
    platform: linux/arm64
    init: true
    network_mode: "service:browser"
    ipc: "service:browser"
    depends_on:
      browser:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - x11:/tmp/.X11-unix
      - ../results/a:/results
    environment:
      ARM: a
      DISPLAY: ":99"
      BASE_URL: http://localhost:8080
      ALT_URL: http://127.0.0.1:8081
      RESULTS_DIR: /results
      MODE: ${MODE:-full}
      CHROME_SANDBOX: ${CHROME_SANDBOX:-unknown}

volumes:
  x11:
